name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bunx oxfmt --check
      - run: bun run typecheck
      - run: bun test
      # Install the packed tarball globally so the bin runs through a symlink, like real consumers.
      - name: Smoke test packed CLI
        run: |
          bun run build
          npm pack
          npm install -g ./leanest-*.tgz
          leanest --help | grep -q Usage
