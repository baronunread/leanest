name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bunx oxfmt --check
      - run: bun run typecheck
      - run: bun test
      # Install the packed tarball globally so the bin runs through a symlink, like real consumers.
      - name: Smoke test packed CLI
        run: |
          bun run build
          npm pack
          npm install -g ./leanest-*.tgz
          leanest --help | grep -q Usage

  # Runs the Action from this checkout against a stub Playwright, so no browsers are needed.
  action:
    runs-on: ubuntu-latest
    # Lets the Action post its sticky report comment on this repo's own PRs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Install this checkout's build so the Action tests it, not the last npm release
      # (on a version bump, npm doesn't have the new version until Release publishes it).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install this checkout's leanest
        run: |
          bun install
          bun run build
          npm pack
          npm install -g ./leanest-*.tgz
      - name: Change the fixture and stub Playwright
        run: |
          echo "// ci touch" >> fixtures/action/price.ts
          git -c user.name=ci -c user.email=ci@localhost commit -qam "ci: touch fixture"
          mkdir -p node_modules/.bin
          printf '#!/bin/sh\necho "$*" >> "$RUNNER_TEMP/playwright-args"\n' > node_modules/.bin/playwright
          chmod +x node_modules/.bin/playwright
      - uses: ./
        with:
          framework: playwright
          args: --shard=1/1
      - name: Check the changed test ran with the passthrough args
        run: |
          cat "$RUNNER_TEMP/playwright-args"
          grep -q "fixtures/action/price.pw.ts" "$RUNNER_TEMP/playwright-args"
          grep -q -- "--shard=1/1" "$RUNNER_TEMP/playwright-args"
          grep -q "leanest-report" "$RUNNER_TEMP/leanest-report.md"
