name: leanest test selector
description: Select and run only the tests affected by this PR's diff.
branding:
  icon: filter
  color: green

inputs:
  framework:
    description: Test framework adapter to use (playwright or vitest)
    required: true
    default: playwright
  base:
    description: Base git ref to diff against (default - the PR base branch, or the previous commit on push)
    required: false
    default: ""
  dir:
    description: Directory of the project under test
    required: false
    default: .
  typesafe-api-key:
    description: TypeSafe API key used for Jev judgments (falls back to a full run if unset)
    required: false
  provider:
    description: Judge provider to select tests with (jev, classifier-dev, or laya)
    required: false
    default: classifier-dev
  args:
    description: Extra arguments passed to the test runner, e.g. --shard=1/3
    required: false
    default: ""
  comment:
    description: Post the selection report as a sticky PR comment (needs pull-requests - write)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Install the leanest version matching this Action's ref, with the runner's own Node.
    # No setup-bun: the CLI runs on plain Node, so the caller's Bun stays untouched.
    # An already-installed matching version is kept (this repo's CI installs its own build).
    - name: Install leanest
      shell: bash
      run: |
        V="$(node -p "require('$GITHUB_ACTION_PATH/package.json').version")"
        npm ls -g "leanest@$V" >/dev/null 2>&1 || npm install -g "leanest@$V"

    - name: Select and run affected tests
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        LEANEST_PROVIDER: ${{ inputs.provider }}
        FRAMEWORK: ${{ inputs.framework }}
        BASE: ${{ inputs.base }}
        DIR: ${{ inputs.dir }}
        ARGS: ${{ inputs.args }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        LEANEST_REPORT_FILE: ${{ runner.temp }}/leanest-report.md
      run: |
        : > "$LEANEST_REPORT_FILE"
        if [ -z "$BASE" ]; then
          if [ -n "$PR_BASE" ]; then BASE="origin/$PR_BASE"
          # A push that creates a branch has an all-zero "before" SHA.
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then BASE="$BEFORE"
          else BASE="origin/$DEFAULT_BRANCH"
          fi
        fi
        # ARGS is split on purpose so each runner flag becomes its own argument.
        leanest "$FRAMEWORK" --base "$BASE" --dir "$DIR" -- $ARGS

    # Edits the comment starting with the report's first line (its marker), or posts a new one.
    # Fails soft: fork PRs get a read-only token, and that must not fail the tests.
    - name: Post the report as a PR comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ runner.temp }}/leanest-report.md
      run: |
        [ -s "$REPORT" ] || exit 0
        export MARKER="$(head -n1 "$REPORT")"
        ID="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
          --jq '.[] | select(.body | startswith(env.MARKER)) | .id' | sed -n 1p)" &&
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$REPORT" >/dev/null
        else
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$REPORT" >/dev/null
        fi ||
        echo "::warning::leanest couldn't post its PR comment. The workflow needs 'pull-requests: write', and fork PRs only get a read-only token."
